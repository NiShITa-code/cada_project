[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cada"
version = "0.1.0"
description = "Obfuscation-robust behavioural vs. textual monitoring of code agents."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Nishita Jain", email = "upmnotion@gmail.com" }]
keywords = ["ai-safety", "llm-agents", "monitoring", "guardrails", "obfuscation", "ebpf"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Security",
]
dependencies = [
    "openai>=1.30.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4.0"]

[project.urls]
Repository = "https://github.com/NiShITa-code/cada_project"

[tool.setuptools.packages.find]
include = ["cada*"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
